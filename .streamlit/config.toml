[theme]
primaryColor = "#2563EB"
linkColor = "#2563EB"
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.light]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.light.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#334155"

[theme.dark]
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
borderColor = "#1E293B"

[theme.dark.sidebar]
backgroundColor = "#060A14"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
borderColor = "#1E293B"
